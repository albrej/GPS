name: Build APK Android

# Se déclenche à chaque envoi (push) sur la branche main,
# et aussi manuellement depuis l'onglet "Actions" de GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances système (sans PPA tierce)
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev cmake libffi-dev \
            libssl-dev automake build-essential
          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))" >> "$GITHUB_ENV"

      - name: Installer Buildozer
        run: pip install --upgrade Cython virtualenv buildozer

      - name: Compiler l'APK (accepte automatiquement les licences Android)
        env:
          # Le NDK Android récent utilise un Clang plus strict qui transforme
          # en erreur bloquante ce qui n'était qu'un avertissement avant,
          # sur du code plus ancien (SDL2/OpenGL) utilisé par Kivy 2.3.0.
          # On repasse ces erreurs précises en simples avertissements.
          CFLAGS: "-Wno-incompatible-function-pointer-types -Wno-implicit-function-declaration"
          CXXFLAGS: "-Wno-incompatible-function-pointer-types -Wno-implicit-function-declaration"
        run: yes | buildozer -v android debug

      - name: Mettre l'APK à disposition en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: outilstraces-apk
          path: bin/*.apk
