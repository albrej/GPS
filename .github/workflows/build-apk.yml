name: Build APK Android

# Se déclenche à chaque envoi (push) sur la branche main,
# et aussi manuellement depuis l'onglet "Actions" de GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

- name: Installer les dépendances système (sans PPA tierce)
  run: |
    sudo apt update
    sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
      zlib1g-dev libncurses-dev libncursesw5-dev cmake libffi-dev \
      libssl-dev automake build-essential
    echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> "$GITHUB_ENV"

      - name: Installer Buildozer
        # IMPORTANT : Kivy 2.3.0 a été conçu et testé avec des versions
        # de Cython antérieures à 3.1. La dernière version de Cython
        # génère un code C légèrement différent qui provoque justement
        # l'erreur de pointeur de fonction incompatible (glShaderSource)
        # rencontrée jusqu'ici, quel que soit le NDK utilisé.
        run: pip install "Cython==3.0.11" virtualenv buildozer

      - name: Compiler l'APK (accepte automatiquement les licences Android)
        run: yes | buildozer -v android debug

      - name: Mettre l'APK à disposition en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: outilstraces-apk
          path: bin/*.apk
